# Free weekly check of the live site's speed, accessibility and SEO with Google Lighthouse.
# The reports are attached to the run (Actions tab → this workflow → Artifacts); nothing is published.
name: Lighthouse

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://slidezza.vercel.app/
            https://slidezza.vercel.app/pricing
            https://slidezza.vercel.app/make/pdf-to-presentation
          runs: 2
          uploadArtifacts: true
          temporaryPublicStorage: false
